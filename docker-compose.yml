version: "3.9"

services:
  content-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-pipeline:latest
    container_name: content-pipeline
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # bind to loopback only — nginx proxies externally
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
