# ── 7. GLOBAL THINGS TO AVOID ───────────────────────────────────────────
global_avoid:
  - "No clear next action, or competing primary CTAs"
  - "Hero-blocking modal on load"
  - "Burying the price ranges (forces the 'how much?' bounce)"
  - "Leaving safety/cancellation objections unanswered until the enquiry form"
  - "Generic one-size copy that targets no persona"
  - "Fake scarcity / countdown timers (off-brand for an honest editorial guide)"
  - "Walls of text with no scannable answer (Guardian of Design)"
  - "Hard 'Book Now' CTA on an awareness-stage guide"
  - "Operator favoritism in comparative content"
