  section_override: "Decision-stage enquiry band may be appended to an awareness/consideration page; declare the override on that section."
  examples:
    - url_or_working_title: "Home — 'The Ultimate Guide to Visiting the Galápagos'"
      stage: awareness
      primary_persona: first_timer
      secondary_personas: [wildlife_lover, eco_purpose]
