      stage: consideration
      primary_persona: first_timer
      secondary_personas: [luxury_seeker, family, wildlife_lover]
      primary_cta: "Talk to a Galápagos Specialist"
      secondary_cta: "Download the Free Galápagos Guide (PDF)"
      objections_to_preempt: [choosing_wrong, hidden_fees, crowds, solo_penalty, accessibility]
      tone_note: "comparative, myth-busting, no operator favoritism"
    - url_or_working_title: "Vessel profile page (e.g. a specific yacht)"
      stage: consideration
      primary_persona: luxury_seeker
      secondary_personas: [family, wildlife_lover]
      primary_cta: "Talk to a Galápagos Specialist"
