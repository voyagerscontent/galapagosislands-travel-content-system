# /etc/nginx/sites-available/content-pipeline
# Run:  sudo certbot --nginx -d pipeline.yourdomain.com
server {
    listen 80;
    server_name pipeline.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pipeline.yourdomain.com;

    # Filled in by certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/pipeline.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pipeline.yourdomain.com/privkey.pem;

    # n8n is the only authorized caller — restrict by IP if possible
    # allow <n8n_ip>;
    # deny all;

    # Simple shared secret — set in n8n HTTP node header X-Pipeline-Key
    # and verify here so the endpoint is never open to the internet.
    # (Generate with:  openssl rand -hex 32)
    # set $pipeline_key "YOUR_SHARED_SECRET_HERE";
    # if ($http_x_pipeline_key != $pipeline_key) { return 403; }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;  # lexicon inject can take up to 10s on large pages
        client_max_body_size 4M;  # polished HTML pages can be large
    }
}
